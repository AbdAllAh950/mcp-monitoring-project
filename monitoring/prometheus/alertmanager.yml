global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'mcp-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'mcp-webhook'
      continue: true
    - match:
        severity: warning
      receiver: 'mcp-webhook'

receivers:
  - name: 'mcp-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8888/webhook/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

