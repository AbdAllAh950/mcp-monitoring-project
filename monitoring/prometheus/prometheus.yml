global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mcp-monitoring-project'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'kafka-simulator'
    static_configs:
      - targets: ['kafka-exporter:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'kafka'

  - job_name: 'spark-simulator'
    static_configs:
      - targets: ['spark-exporter:8002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'spark'

  - job_name: 'hdfs-simulator'
    static_configs:
      - targets: ['hdfs-exporter:8003']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'hdfs'

  - job_name: 'mcp-server'
    static_configs:
      - targets: ['host.docker.internal:8888']

